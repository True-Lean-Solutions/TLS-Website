  - type: richtext
    markdown: |
      Most enterprise software doesn't need Go or Rust. Most of it is fine in Python, Node, or whatever the team already knows well. But a specific class of problems — high concurrency, strict memory guarantees, performance under sustained load — punishes teams that default to a familiar stack instead of the right one.

      ## Where the common stacks start to strain

      Interpreted, garbage-collected languages trade raw performance and predictability for developer speed and ecosystem breadth — a good trade for most applications. It stops being a good trade when a system has to handle thousands of concurrent connections with predictable latency, or when a single dropped edge case in memory handling has real financial or safety consequences.
  - type: cards
    heading: What these languages actually buy you
    columns: 2
    items:
      - icon: zap
        title: Predictable performance under concurrency
        body: Go's goroutines and Rust's zero-cost abstractions handle high concurrency without the unpredictable pauses garbage-collected runtimes introduce under load.
      - icon: shield
        title: Memory safety without the overhead
        body: Rust's ownership model catches memory errors at compile time — no garbage collector, no runtime overhead, no whole category of production crashes.
      - icon: rocket
        title: Simpler deployment models
        body: Both compile to single binaries with minimal runtime dependencies — fewer moving parts in production infrastructure.
      - icon: gear
        title: Long-term maintainability at scale
        body: Static typing and compiler-enforced correctness catch entire classes of bugs before they reach code review, let alone production.
  - type: steps
    heading: Knowing when to reach for which
    accent: plum
    items:
      - title: Reach for Go when concurrency is the bottleneck
        body: Systems handling many simultaneous connections — APIs, network services, real-time processing — benefit most from Go's concurrency model and fast build times.
      - title: Reach for Rust when correctness and memory safety are non-negotiable
        body: Systems where a memory error is unacceptable — low-level infrastructure, performance-critical paths, safety-relevant logic — justify Rust's steeper learning curve.
      - title: Stay with your existing stack when the bottleneck isn't the language
        body: If the real problem is architecture, query design, or infrastructure, a language migration won't fix it — it will just move the same problem into an unfamiliar codebase.
      - title: Migrate incrementally, not wholesale
        body: The highest-leverage services get moved first; the rest of the system keeps running on its existing stack until there's a real reason to change it.
  - type: callout
    variant: dark
    title: The principle — the language should follow the problem, not the team's comfort zone
    body: We don't reach for Go or Rust because they're impressive. We reach for them when the problem the system actually has requires the guarantees only they provide.
    tag: Go · Rust · Systems engineering
