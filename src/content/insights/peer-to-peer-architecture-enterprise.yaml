  - type: cards
    heading: The enterprise lessons
    columns: 2
    items:
      - icon: shield
        title: Eliminate single points of failure
        body: Instead of "the server is down, everything stops," you get graceful degradation — the system continues under partial failure.
      - icon: zap
        title: Design the failure model first
        body: The question is not just how do we build this — it is what happens when one part fails, and is the system ready for it.
      - icon: integration
        title: Independent subsystems reduce complexity
        body: Modular architecture enables independent development of each layer, significantly reducing debugging complexity and team dependencies.
      - icon: chart
        title: Serverless by design scales differently
        body: No dedicated host means no scaling bottleneck at the centre. The network grows as peers join — not as you provision more servers.
  - type: richtext
    markdown: |
      ## What this means for your architecture

      The same thinking applies when designing integration architectures, event-driven systems, or any platform that needs to remain available under partial failure conditions. Most enterprise teams skip the failure-model question until the first major incident. We ask it at the start.
  - type: callout
    variant: dark
    title: Our architecture principle — design for what fails, not just for what works
    body: Resilience is not added after the fact. It is a first-class design decision made at the start of every build.
